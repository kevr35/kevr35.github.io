<header class="header">
  <nav class="nav">
    <div class="logo">
      <a href="{{ site.Home.RelPermalink }}" accesskey="h" title="{{ site.Title }} (Alt + H)">{{ site.Title }}</a>
      <div class="logo-switches">
        {{ if not site.Params.disableThemeToggle }}
        <button id="theme-toggle" accesskey="t" title="(Alt + T)" aria-label="Toggle theme">
          <svg id="moon" xmlns="http://www.w3.org/2000/svg" width="24" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
          <svg id="sun" xmlns="http://www.w3.org/2000/svg" width="24" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line></svg>
        </button>
        {{ end }}
      </div>
    </div>
    <ul id="menu">
      {{ range site.Menus.main }}
      {{ $url := .URL }}
      {{ if not (findRE `^[a-zA-Z][a-zA-Z0-9+.-]*://` .URL) }}{{ $url = .URL | relLangURL }}{{ end }}
      <li><a href="{{ $url }}" title="{{ .Title | default .Name }}"><span{{ if eq $url $.RelPermalink }} class="active"{{ end }}>{{ .Pre }}{{ .Name }}{{ .Post }}</span></a></li>
      {{ end }}
    </ul>
  </nav>
</header>
